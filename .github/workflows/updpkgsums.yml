name: updpkgsums

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  updpkgsums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          # A PAT/App token makes the auto-commit re-trigger required checks
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}

      - name: Find updated packages
        run: |
          set -euo pipefail
          pkgs=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | cut -d/ -f1 | sort -u |
            while read -r d; do if [[ -f $d/PKGBUILD ]]; then echo "$d"; fi; done | xargs)
          echo "Packages: ${pkgs:-<none>}"
          echo "pkgbuilds=$pkgs" >>"$GITHUB_ENV"

      - name: Update checksums
        if: ${{ env.pkgbuilds != '' }}
        uses: ./.github/actions/aur
        with:
          action: "updpkgsums"
          pkgname: ${{ env.pkgbuilds }}
          base: origin/${{ github.base_ref }}

      - name: Commit
        if: ${{ env.pkgbuilds != '' }}
        env:
          BOT_EMAIL: renovate@whitesourcesoftware.com
        run: |
          set -euo pipefail
          git add -- '*/PKGBUILD'
          if git diff --cached --quiet; then
            echo "Checksums already up to date"
            exit 0
          fi
          git config user.name "Renovate Bot"
          git config user.email "$BOT_EMAIL"
          # Fold the checksum fix into Renovate's own update commit, so each
          # update is a single commit. Never rewrite commits made by people.
          if [[ "$(git log -1 --format=%ae)" == "$BOT_EMAIL" ]]; then
            git commit --amend --no-edit
            git push --force-with-lease origin "HEAD:${GITHUB_HEAD_REF}"
          else
            git commit -m "chore: update checksums"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
