name: updpkgsums

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  updpkgsums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          # A PAT/App token makes the auto-commit re-trigger required checks
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}

      - name: Find updated packages
        run: |
          set -euo pipefail
          pkgs=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | cut -d/ -f1 | sort -u |
            while read -r d; do if [[ -f $d/PKGBUILD ]]; then echo "$d"; fi; done | xargs)
          echo "Packages: ${pkgs:-<none>}"
          echo "pkgbuilds=$pkgs" >>"$GITHUB_ENV"

      - name: Update checksums
        if: ${{ env.pkgbuilds != '' }}
        uses: ./.github/actions/aur
        with:
          action: "updpkgsums"
          pkgname: ${{ env.pkgbuilds }}
          base: origin/${{ github.base_ref }}

      - name: Commit
        if: ${{ env.pkgbuilds != '' }}
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_user_name: Renovate Bot
          commit_user_email: renovate@whitesourcesoftware.com
          commit_author: Renovate Bot <renovate@whitesourcesoftware.com>
          file_pattern: "*/PKGBUILD"
