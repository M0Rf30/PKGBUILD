name: renovate

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main
    paths:
      - "*/PKGBUILD"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.6
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_ALLOWED_HEADERS: '["Snap-Device-Series"]'
          RENOVATE_HOST_RULES: '[{"matchHost":"api.snapcraft.io","headers":{"Snap-Device-Series":"16"}}]'
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
