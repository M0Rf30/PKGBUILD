# Example ntkd configuration. Authoritative field list and validation rules:
# crates/ntkd/src/kernel/config.rs (NtkdConfig) in https://github.com/M0Rf30/netsukuku-rs.

# Per-level g-node sizes, index 0 = innermost level. Every node sharing an L3 mesh must agree on
# this array — it defines the fixed address-space hierarchy Topology::new builds against. The
# value below matches this project's own multi-node integration tests; size it for your
# deployment before joining a real mesh.
gsizes = [4, 2, 2, 2]

# Network interfaces ntkd monitors for neighbours and binds RPC traffic to.
#
# MANDATORY, and deliberately left unset: there is no safe default. ntkd is an L3 routing daemon
# — it programs real kernel routes and claims 10.0.0.0/8 — so a default that happened to name an
# interface you actually use would quietly start meshing over your uplink. `eth0` is the worst
# case precisely because it often exists: on a container, or any host booted with
# net.ifnames=0, eth0 IS the primary interface.
#
# Until you set it, ntkd refuses to start and names this file:
#   failed to load config /etc/ntkd/ntkd.toml: ... missing field `nics`
# An empty list is accepted by the parser but is a silent no-op — the daemon starts and meshes
# over nothing — so it is not a shortcut.
#
# List the candidates with `ls /sys/class/net`. Pick the interface(s) facing your mesh peers, not
# your internet uplink. Skip loopback, and skip point-to-point tunnels (wg*, tailscale*, tun*):
# neighbour discovery is UDP broadcast, which they do not carry.
#nics = ["eth0"]

# TCP/UDP port every RPC transport (unicast TcpServer, broadcast UdpBroadcaster) binds to. 269 is
# this project's conventional default, used throughout its own config examples and test suite.
port = 269

# Path to this node's persisted ANDNA (distributed hostname) ed25519 signing-key seed. Left
# unset, ntkd refuses ANDNA registration outright rather than guessing a path. Uncomment to
# enable it; /var/lib/ntkd is the packaged systemd unit's StateDirectory.
#andna_key_path = "/var/lib/ntkd/andna.key"

# Path to this node's persisted RPC-identity ed25519 signing-key seed, used to sign outbound
# calls. Deliberately a different key from andna_key_path: rotating a compromised transport key
# must not forfeit hostnames this node already registered under its ANDNA key.
#
# REQUIRED to register an ANDNA hostname on another node. ANDNA registration and its anti-Sybil
# counter reservation always demand a verified origin, regardless of require_auth below, because
# the counter caps per requester and an unattributable request makes that cap meaningless.
# Resolution needs no key. Vanilla enforces the same way (it signs a registration and the counter
# check, never a lookup), and unlike require_auth this costs no interoperability: upstream Vala
# has no ANDNA at all.
#node_key_path = "/var/lib/ntkd/node.key"

# Reject inbound RPCs lacking a valid ntk_proto::auth block. Must stay false to interoperate with
# an unmodified upstream Vala node — the Auth field is optional on the wire, so adding it is
# compatible but *enforcing* it is not. Enabling this requires node_key_path above.
require_auth = false
